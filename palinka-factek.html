
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pálinka fun factek</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #272727;
    font-family: 'Poppins', Arial, sans-serif;
  }

  .fact-widget {
    width: 100%;
    min-height: 320px;
    background: #272727;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 32px;
    position: relative;
    overflow: hidden;
  }

  .fact-card {
    background: #313131;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 28px 40px 32px;
    max-width: 640px;
    width: 100%;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .fact-card.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .fact-widget:hover .fact-card {
    box-shadow: 0 10px 28px rgba(0,0,0,0.32);
  }

  .nav-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-top: 20px;
  }

  .nav-arrow {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .nav-arrow:hover {
    background: #C16F56;
    border-color: #C16F56;
    color: #ffffff;
  }

  .nav-arrow svg {
    width: 18px;
    height: 18px;
  }

  @media (max-width: 600px), (hover: none) and (pointer: coarse) {
    .nav-controls { display: none; }
  }


  .card-progress-track {
    width: 100%;
    height: 4px;
    border-radius: 4px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
    margin-bottom: 22px;
  }

  @keyframes shrinkBar {
    from { transform: scaleX(1); }
    to { transform: scaleX(0); }
  }

  .card-progress-bar {
    height: 100%;
    width: 100%;
    border-radius: 4px;
    background: #C16F56;
    transform-origin: left;
    transform: scaleX(1);
  }

  .fact-icon {
    display: block;
    width: 30px;
    height: 30px;
    margin: 0 auto 14px;
  }

  .fact-title {
    color: #ffffff;
    font-size: 19px;
    font-weight: 600;
    line-height: 1.4;
    text-align: center;
    margin-bottom: 10px;
  }

  .fact-text {
    color: rgba(255,255,255,0.7);
    font-size: 15px;
    font-weight: 400;
    line-height: 1.65;
    text-align: center;
    letter-spacing: 0.1px;
  }

  .fact-text .accent {
    color: #C16F56;
    font-weight: 700;
  }

  .dots {
    position: absolute;
    top: 20px;
    right: 24px;
    display: flex;
    gap: 6px;
  }

  .dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    transition: background 0.3s ease;
  }

  .dots span.active {
    background: #C16F56;
  }

  .counter {
    position: absolute;
    top: 20px;
    left: 24px;
    color: rgba(255,255,255,0.35);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  @media (max-width: 600px) {
    .fact-widget { min-height: 260px; padding: 40px 20px; }
    .fact-title { font-size: 17px; }
    .fact-text { font-size: 14px; }
    .dots { display: none; }
  }
</style>
</head>

    "🔥 A túl gyors főzés nem feltétlenül jobb. A lepárlásnál nem az a cél, hogy minél hamarabb elkészüljön a párlat. A fűtés és a lepárlás megfelelő szabályozása fontos szerepet játszik a kívánt minőség elérésében.",
    "🥃 Van elő-, közép- és utópárlat. A lepárlás során különböző frakciók jelennek meg. A főzőmester feladata, hogy megfelelően elkülönítse azokat, és a kívánt minőségű középpárlatot válassza ki.",
    "🍐 Ugyanannyi cefréből nem feltétlenül ugyanannyi pálinka lesz. A kihozatal függ többek között a gyümölcs fajtájától, érettségétől, cukortartalmától és a cefre erjedésétől. Ezért 100 liter cefrére sem lehet minden esetben ugyanannyi kész párlatot ígérni.",
    "⚙️ A lepárlóberendezés kialakítása is számít. Az üst, a páracső, a hűtés és a különböző finomító elemek kialakítása mind hatással lehet a lepárlás folyamatára és a kész párlat karakterére.",
    "🔥 A kisüsti és az egylépcsős technológia nem ugyanaz. A kisüsti, kétlépcsős lepárlás során a cefréből először alszesz készül, majd egy második lepárlással finomítják azt. Az egylépcsős rendszerek ezzel szemben egy lepárlási folyamatban állítják elő a párlatot.",
    "🥃 A párlat és a pálinka nem ugyanaz. Minden pálinka párlat, de nem minden gyümölcspárlat nevezhető pálinkának. A „pálinka” megnevezés használatát külön jogszabályok szabályozzák.",
    "🇭🇺 A pálinka hungarikum. A pálinka Magyarország egyik legismertebb nemzeti terméke, amelynek előállítását és megnevezését külön magyar szabályozás is védi.",
    "🌳 Nem mindegy, honnan származik a gyümölcs. A pálinka egyik különlegessége éppen az, hogy a magyarországi gyümölcsből készülő párlatnak sajátos termőhelyi és gyümölcsfajta-jellege lehet. A gyümölcs származása jogilag is fontos a „pálinka” megnevezés használatánál.",
    "🍑 A gyümölcs fajtája meghatározza a párlat karakterét. Más aromákat és más összetételt ad egy kajszibarack, egy szilva, egy körte vagy egy alma. Éppen ezért minden gyümölcs más technológiai megközelítést igényelhet.",
    "👃 A jó pálinkát nem csak inni lehet – érdemes szagolni is. A pálinka aromáinak jelentős része már illat alapján érzékelhető. Egy megfelelő pálinkáspohár segíthet abban, hogy az illatokat koncentráltabban érezd.",
    "🥂 A pohár sem mindegy. A tulipán alakú pálinkáspohár formája segíthet az aromák összegyűjtésében, így kóstoláskor jobban érzékelhetők a párlat illatjegyei.",
    "💧 A párlat alkoholfokát be lehet állítani. A lepárlás után a párlat alkoholtartalma általában magasabb annál, mint ahogy fogyasztani szeretnénk. A kész párlatot megfelelő minőségű vízzel a kívánt alkoholfokra lehet beállítani.",
    "⏳ Egyes párlatoknak jót tehet a pihentetés. A beállított párlatnak időre lehet szüksége ahhoz, hogy az alkohol, a víz és az aromaanyagok egyenletesebben összeálljanak. Ezért a frissen beállított párlat és a később pihentetett pálinka érzékelhetően eltérhet egymástól.",
    "🏭 A pálinkafőzés ma már komoly technológia. Egy modern pálinkafőzde nem egyszerűen egy üstből áll. A cefre fogadásától és kezelésétől a lepárláson át egészen a hűtésig és a párlat kezeléséig összehangolt technológiai rendszer dolgozik a háttérben."
  ];

  const DISPLAY_MS = 6000; // ennyi ideig látszik egy fact (elolvasható tempó)

  let current = 0;
  let remainingMs = DISPLAY_MS;
  let segmentStart = null;
  let advanceTimer = null;
  let paused = false;

  const titleEl = document.getElementById('factTitle');
  const textEl = document.getElementById('factText');
  const cardEl = document.getElementById('factCard');
  const counterEl = document.getElementById('counter');
  const progressBar = document.getElementById('progressBar');
  const widgetEl = document.getElementById('widget');

  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  // levágja a vezető emojit/szimbólumokat, majd szétválasztja az első
  // mondatot (cím) a maradék szövegtől (törzsszöveg)
  function parseFact(raw){
    const cleaned = raw.replace(/^[^\p{L}]+/u, '').trim();
    const match = cleaned.match(/^(.+?[.!?])\s+([\s\S]+)$/);
    if (match) {
      return { title: match[1].replace(/\.$/, ''), body: match[2] };
    }
    return { title: cleaned, body: '' };
  }

  function startProgressBar(ms){
    progressBar.style.animation = 'none';
    progressBar.style.transform = 'scaleX(1)';
    void progressBar.offsetWidth; // kényszerített reflow az újraindításhoz
    progressBar.style.animation = 'shrinkBar ' + ms + 'ms linear forwards';
  }

  function showFact(index){
    cardEl.classList.remove('visible');
    paused = false;

    setTimeout(() => {
      const parsed = parseFact(FACTS[index]);
      titleEl.textContent = parsed.title;
      textEl.textContent = parsed.body;
      counterEl.textContent = pad(index + 1) + ' / ' + FACTS.length;
      cardEl.classList.add('visible');

      remainingMs = DISPLAY_MS;
      startProgressBar(DISPLAY_MS);
      scheduleAdvance(DISPLAY_MS);

      // azonnal jelezzük az új magasságot a szülőoldalnak, ne kelljen
      // megvárni a 0,5 mp-es polling ciklust - ez előzi meg, hogy hosszabb
      // szövegnél egy pillanatra megjelenjen a görgetősáv
      postHeight();
      // a fade-in átmenet (0.5s) végén még egyszer, a végleges,
      // beállt magassággal is újraküldjük
      setTimeout(postHeight, 500);
    }, 350);
  }

  function next(){
    current = (current + 1) % FACTS.length;
    showFact(current);
  }

  function prev(){
    current = (current - 1 + FACTS.length) % FACTS.length;
    showFact(current);
  }

  function scheduleAdvance(ms){
    clearTimeout(advanceTimer);
    segmentStart = Date.now();
    advanceTimer = setTimeout(next, ms);
  }

  function pause(){
    if (paused) return;
    paused = true;
    clearTimeout(advanceTimer);
    remainingMs -= (Date.now() - segmentStart);
    if (remainingMs < 0) remainingMs = 0;
    progressBar.style.animationPlayState = 'paused';
  }

  function resume(){
    if (!paused) return;
    paused = false;
    progressBar.style.animationPlayState = 'running';
    scheduleAdvance(remainingMs);
  }

  widgetEl.addEventListener('mouseenter', pause);
  widgetEl.addEventListener('mouseleave', resume);

  // --- Nyíl gombok (csak desktopon láthatók) ---
  const prevArrow = document.getElementById('prevArrow');
  const nextArrow = document.getElementById('nextArrow');

  prevArrow.addEventListener('click', prev);
  nextArrow.addEventListener('click', next);

  // --- Swipe kezelés mobilon ---
  let touchStartX = 0;
  let touchStartY = 0;

  widgetEl.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].clientX;
    touchStartY = e.changedTouches[0].clientY;
    pause();
  }, { passive: true });

  widgetEl.addEventListener('touchend', (e) => {
    const touchEndX = e.changedTouches[0].clientX;
    const touchEndY = e.changedTouches[0].clientY;
    const deltaX = touchEndX - touchStartX;
    const deltaY = touchEndY - touchStartY;

    // csak akkor számít swipe-nak, ha vízszintesen jóval nagyobb az elmozdulás,
    // mint függőlegesen (így az oldal görgetése nem indít váltást)
    if (Math.abs(deltaX) > 40 && Math.abs(deltaX) > Math.abs(deltaY)) {
      if (deltaX < 0) {
        next();
      } else {
        prev();
      }
    } else {
      resume();
    }
  }, { passive: true });

  // --- Iframe automatikus magasság-igazítás ---
  // Elküldi a widget tényleges magasságát a szülőoldalnak (postMessage-en
  // keresztül, mivel az iframe másik domainről töltődik be), hogy az iframe
  // pontosan akkora legyen, mint a tartalom - se görgetősáv, se üres hely.
  let lastPostedHeight = null;
  function postHeight(){
    const h = Math.ceil(widgetEl.getBoundingClientRect().height);
    // csak akkor küldünk, ha a magasság ténylegesen változott - enélkül az
    // iframe átméretezése saját magát váltaná ki újra (resize esemény a
    // gyermek oldalon), ami végtelen körbe futtatná az újramérést
    if (h === lastPostedHeight) return;
    lastPostedHeight = h;
    window.parent.postMessage({ type: 'palinka-fact-resize', height: h }, '*');
  }

  // Előre lemérjük, hogy a 20 fact közül melyiknek a legmagasabb a kártyája,
  // és a kártyát erre a rögzített magasságra állítjuk. Így diaváltáskor a
  // widget mérete SOHA nem változik, tehát a szülőoldalnak sincs mit
  // újraküldeni - ez zárja ki, hogy egy pillanatra felvillanjon a görgetősáv.
  function lockCardHeight(){
    const originalTransition = cardEl.style.transition;
    cardEl.style.transition = 'none';
    cardEl.style.minHeight = '0px';

    let maxH = 0;
    for (let i = 0; i < FACTS.length; i++){
      const parsed = parseFact(FACTS[i]);
      titleEl.textContent = parsed.title;
      textEl.textContent = parsed.body;
      const h = cardEl.scrollHeight;
      if (h > maxH) maxH = h;
    }

    cardEl.style.minHeight = maxH + 'px';
    // visszaírjuk az ÉPPEN AKTUÁLISAN látszó fact tartalmát - nem hagyjuk
    // üresen, mert az üres állapot csak showFact() hívásakor tölt vissza
    const currentParsed = parseFact(FACTS[current]);
    titleEl.textContent = currentParsed.title;
    textEl.textContent = currentParsed.body;

    void cardEl.offsetHeight; // kényszerített reflow
    cardEl.style.transition = originalTransition;
  }

  function startShow(){
    lockCardHeight();
    showFact(current);
  }

  window.addEventListener('load', postHeight);

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      lockCardHeight();
      postHeight();
    }, 200);
  });

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(startShow);
  } else {
    startShow();
  }
</script>
